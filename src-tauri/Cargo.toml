[package]
name = "dollie-desktop"
version = "0.2.1"
description = "Dollie Desktop App"
authors = ["Dollie"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-deep-link = "2.6"
tauri-plugin-notification = "2.6"
tauri-plugin-opener = "2.7"
tauri-plugin-process = "2.4"
tauri-plugin-updater = "2.13"
tauri-plugin-window-state = "2.5"
base64 = "0.22"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "linux-native"] }
rand = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls-no-provider"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"
tokio = { version = "1", features = ["time"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "bitflags", "block2", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }

[lints.rust]
unexpected_cfgs = "allow"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
